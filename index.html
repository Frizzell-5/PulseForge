<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PulseForge Studio</title>
  <meta name="description" content="PulseForge Studio: a free, open-source music studio that runs anywhere: browser, desktop, tablet and phone.">
  <meta name="theme-color" content="#0d0f17">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand" title="PulseForge Studio">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><defs><linearGradient id="lg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff5c8a"/><stop offset="1" stop-color="#ffb547"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#lg)"/><path d="M4 17h5l3-8 4 15 3-11 2 4h7" fill="none" stroke="#0d0f17" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>PulseForge</span>
    </div>

    <div class="menus">
      <button class="menu-btn" data-menu="file">File</button>
      <button class="menu-btn" data-menu="view">View</button>
      <button class="menu-btn" data-menu="tools">Tools</button>
    </div>

    <div class="transport">
      <button id="btnPlay" class="tbtn play" title="Play / Stop (Space)" aria-label="Play">▶</button>
      <button id="btnStop" class="tbtn" title="Stop and rewind" aria-label="Stop">■</button>
      <button id="btnRec" class="tbtn rec" title="Record notes from keyboard / MIDI (Shift+R)" aria-label="Record">●</button>
      <button id="btnMetro" class="tbtn small" title="Metronome (Shift+M)" aria-label="Metronome">♩</button>
      <div class="mode" role="group" aria-label="Playback mode">
        <button id="modePat" class="on" title="Loop the selected pattern (Shift+L)">PAT</button>
        <button id="modeSong" title="Play the playlist arrangement (Shift+L)">SONG</button>
      </div>
      <label class="field bpm" title="Tempo (drag or type)"><span>BPM</span><input id="bpm" type="number" min="40" max="300" step="1" value="128"></label>
      <label class="field" title="Swing"><span>SWING</span><input id="swing" type="range" min="0" max="0.6" step="0.01" value="0"></label>
      <div id="pos" class="lcd" title="Bar : Beat : Step">1:1:1</div>
    </div>

    <div class="pattern-picker">
      <button id="patPrev" class="tbtn small" title="Previous pattern">‹</button>
      <select id="patSelect" aria-label="Current pattern"></select>
      <button id="patNext" class="tbtn small" title="Next pattern">›</button>
      <button id="patAdd" class="tbtn small" title="New pattern">＋</button>
    </div>

    <canvas id="scope" width="160" height="34" title="Master output"></canvas>

    <div class="right">
      <button id="btnPalette" class="ghost" title="Command palette (Ctrl/⌘ + K)">⌘K</button>
      <button id="btnGuide" class="ghost" title="User guide (F1)">Guide</button>
      <button id="btnTheme" class="ghost" title="Toggle light/dark">◐</button>
    </div>
  </header>

  <div id="menuPop" class="popover" hidden></div>

  <main id="workspace">
    <section class="win" data-panel="browser" aria-label="Browser">
      <div class="win-title"><span>Browser</span><kbd>F8</kbd><div class="win-actions"><button data-act="max" title="Maximize">▢</button><button data-act="close" title="Hide">✕</button></div></div>
      <div class="win-body" id="browser"></div>
      <div class="win-resize"></div>
    </section>

    <section class="win" data-panel="playlist" aria-label="Playlist">
      <div class="win-title"><span>Playlist — Arrangement</span><kbd>F5</kbd>
        <div class="win-tools" id="plTools"></div>
        <div class="win-actions"><button data-act="max" title="Maximize">▢</button><button data-act="close" title="Hide">✕</button></div></div>
      <div class="win-body canvas-host" id="playlist"></div>
      <div class="win-resize"></div>
    </section>

    <section class="win" data-panel="rack" aria-label="Channel rack">
      <div class="win-title"><span>Channel Rack</span><kbd>F6</kbd>
        <div class="win-tools" id="rackTools"></div>
        <div class="win-actions"><button data-act="max" title="Maximize">▢</button><button data-act="close" title="Hide">✕</button></div></div>
      <div class="win-body" id="rack"></div>
      <div class="win-resize"></div>
    </section>

    <section class="win" data-panel="pianoroll" aria-label="Piano roll">
      <div class="win-title"><span id="prTitle">Piano Roll</span><kbd>F7</kbd>
        <div class="win-tools" id="prTools"></div>
        <div class="win-actions"><button data-act="max" title="Maximize">▢</button><button data-act="close" title="Hide">✕</button></div></div>
      <div class="win-body canvas-host" id="pianoroll"></div>
      <div class="win-resize"></div>
    </section>

    <section class="win" data-panel="mixer" aria-label="Mixer">
      <div class="win-title"><span>Mixer</span><kbd>F9</kbd><div class="win-actions"><button data-act="max" title="Maximize">▢</button><button data-act="close" title="Hide">✕</button></div></div>
      <div class="win-body" id="mixer"></div>
      <div class="win-resize"></div>
    </section>
  </main>

  <nav id="tabbar" aria-label="Panels">
    <button data-tab="rack" class="on"><b>▦</b>Rack</button>
    <button data-tab="pianoroll"><b>♫</b>Piano</button>
    <button data-tab="playlist"><b>☰</b>Song</button>
    <button data-tab="mixer"><b>⫼</b>Mixer</button>
    <button data-tab="browser"><b>✚</b>Browse</button>
  </nav>

  <div id="modal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"></div></div>
  <div id="palette" class="modal" hidden>
    <div class="palette-card"><input id="paletteInput" placeholder="Type a command… (e.g. export, add kick, mixer)" autocomplete="off"><ul id="paletteList"></ul></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="fileOpen" accept=".pfproj,.json" hidden>
  <input type="file" id="fileSample" accept="audio/*" multiple hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
